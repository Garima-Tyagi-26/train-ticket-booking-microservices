spring.application.name=api-gateway

server.port=8080

# User Service
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${USER_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/users/**

# Authentication Service
spring.cloud.gateway.server.webmvc.routes[1].id=auth-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/auth/refresh

# Booking Service Endpoints
spring.cloud.gateway.server.webmvc.routes[2].id=booking-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${BOOKING_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/bookings/**

# Train endpoints
spring.cloud.gateway.server.webmvc.routes[3].id=train-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${BOOKING_SERVICE_URL}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/trains/**